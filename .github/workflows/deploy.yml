name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint KB (errors block deploy)
        run: |
          pip install -q pyyaml
          python tools/lint.py .
      - name: Build site
        run: |
          mkdir -p site
          cp -r app/. site/
          python tools/build_index.py
          mkdir -p site/data
          cp -r data/mods site/data/
          # bump the service-worker cache name so installed copies pick up the new build
          sed -i "s/codex-v1/codex-${GITHUB_SHA::8}/" site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
