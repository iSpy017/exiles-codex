# Unresolved and resolved source conflicts. Never settled silently: both claims kept.
conflicts:
  - id: C001
    topic: "Dual-wield \"both hands\" skills: one combined hit or two hits? (added 2026-11-25)"
    from: kb/04-conflicts.md
    status: open
    text: |
      - Doc: kb/mechanics/attack-cast-speed.md
      - Source A: [poe2wiki Dual wielding](https://www.poe2wiki.net/wiki/Dual_wielding), tier 2, rev 135854, 2026-11-25 — skills that use both hands make one combined hit: each hand rolls, damage summed, one crit makes the whole hit a crit
      - Source B: Path of Building PoE2 pull request #2006 (mirror seen via search, 2026-11-25), tier 5 — skills flagged "double hits when dual wielding" make two separate near-simultaneous hits, not a combined hit
      - Status: open. May be skill-specific (wiki says "determined by the skill"). Check a dual-wield skill's tooltip/hit count in game.
  - id: C002
    topic: "Regeneration rate vs recovery rate: separate multipliers? (added 2026-11-25)"
    from: kb/04-conflicts.md
    status: open
    text: |
      - Doc: kb/mechanics/recovery.md
      - Source A: [Mobalytics Regeneration](https://mobalytics.gg/poe-2/guides/regeneration), tier 3, updated 2025-09-17 — recovery-rate mods are a separate multiplier on top of regen-rate mods
      - Source B: [GGG forum thread 3667720](https://pathofexile.com/forum/view-thread/3667720) (player post, title only), tier 5, early access — "mana regeneration rate and mana recovery rate now work in the same multiplication interval in poe2"
      - Status: open, leaning A (newer, tier 3; B is an early-access player observation). Check poe2wiki Regeneration page or test in game.
  - id: C003
    topic: "Monster critical damage bonus"
    from: kb/04-conflicts.md
    status: resolved
    text: |
      - Doc: kb/mechanics/crit.md, kb/mechanics/monster-life.md
      - Source A: [poe2wiki Critical hit](https://poe2wiki.net/wiki/Critical_hit), tier 2, 0.5.x, 2026-11-17 — monsters have 40% less bonus critical damage than players (implies +60%)
      - Source B: [Mobalytics Critical Hits](https://mobalytics.gg/poe-2/guides/critical-hits), tier 3, undated, 2026-11-17 — default monster crit damage bonus is 30%
      - Source C: [PoE2DB Monster](https://poe2db.tw/us/Monster) "Monster Default" table (base_critical_hit_damage_bonus 30) + boss pages showing "Critical Damage Bonus +30%", tier 2, crawl 2026-11-23
      - Status: resolved by game data (2026-11-23) in favour of B: +30%. A likely describes an older value.
